[project]
name = "realbot-relay"
version = "0.1.0"
description = "Hackathon WebSocket relay and robot simulator for RealBot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pillow>=11,<12",
  "realbot-edge-agent",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<16",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "simulator"]

[tool.uv.sources]
realbot-edge-agent = { path = "../edge_agent", editable = true }

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
