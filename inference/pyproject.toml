[project]
name = "bbapps-inference"
version = "0.0.1"
description = "BracketBot policy-inference client (async inference runner)."
requires-python = "==3.10.*"
dependencies = [
    "bbos",
    "torch>=2.0.0",
    "grpcio",
    "protobuf",
    "opencv-python",
    "numpy",
    "tqdm",
    "google-genai",
    "openai",
    "PyYAML",
]

# This directory is a runnable script collection (live_inference.py / replay_training.py),
# not an installable package, so don't try to build it.
[tool.uv]
package = false

[tool.uv.sources]
# bbos is the local package at the repo root, installed editable (mirrors the
# per-daemon `pip install -e` convention).
bbos = { path = "../../bbos", editable = true }
# torch comes from the Jetson wheel index, same as bbos/pyproject.toml.
torch = { index = "jetson" }

[[tool.uv.index]]
name = "jetson"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126"
explicit = true
