[project]
name = "realbot-edge-agent"
version = "0.1.0"
description = "Robot-authoritative runtime contracts for RealBot"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8,<9"]
